# The public archive, in demo mode: draft an issue from public AI news feeds,
# build the static site, and upload it as a workflow artifact. Nothing is deployed,
# published or exported; the owner picks the host. Each page is labeled as an
# automated demo, because no person reviews it.
#
# Runs by hand only (Actions tab). The daily schedule was removed on 2026-11-07: no model
# was configured, so every scheduled run failed. A one-time sample is committed in
# docs/sample-archive/. Never add a pull request trigger: this job holds
# the model key. tests/test_daily.py checks this file and runs the same build offline.
#
# The owner sets the secret NEWSLETTER_API_KEY and the repository variables
# NEWSLETTER_BASE_URL (optional) and NEWSLETTER_FAST_MODEL. Without a model the build
# step fails before fetching anything, and the run shows red.
name: Daily archive

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --no-dev
      # Five feeds, five items each: at most 25 fast-model calls a day.
      - name: Draft the issue and build the archive (automated demo)
        id: build
        env:
          NEWSLETTER_API_KEY: ${{ secrets.NEWSLETTER_API_KEY }}
          NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL }}
          NEWSLETTER_FAST_MODEL: ${{ vars.NEWSLETTER_FAST_MODEL }}
          NEWSLETTER_TIMEOUT: "30"
          NEWSLETTER_MAX_RETRIES: "1"
        run: >-
          uv run newsletter archive --demo
          --site site
          --title "AI Daily (automated demo)"
          --topic "AI"
          --per-feed 5
          https://openai.com/news/rss.xml
          https://blog.google/technology/ai/rss/
          https://huggingface.co/blog/feed.xml
          https://www.technologyreview.com/topic/artificial-intelligence/feed
          https://bair.berkeley.edu/blog/feed.xml
      # Uploaded even when a feed or summary failed (the run still shows red), so the
      # run report can be read; not after a cancel.
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: archive-site
          path: site/
          if-no-files-found: error
          retention-days: 14
