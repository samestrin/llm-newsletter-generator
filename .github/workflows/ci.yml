name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=newsletter --cov-report=term-missing --cov-fail-under=80
      - run: uv run python -m newsletter.evals

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The embassy compose file is valid
        run: |
          printf 'NEWSLETTER_API_TOKEN=ci-dummy\nNEWSLETTER_API_ORIGINS=https://newsletter.estr.in\n' > .env.embassy
          docker compose -f docker-compose.embassy.yml config -q
          rm .env.embassy
      - name: The demo compose file is valid
        run: |
          printf 'NEWSLETTER_API_KEY=ci-dummy\nNEWSLETTER_API_TOKEN=ci-dummy\n' > .env.demo
          docker compose -f docker-compose.demo.yml config -q
          rm .env.demo
      - run: docker compose up --build --wait --wait-timeout 300
      - name: The page is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: The page reaches the API through its own origin
        run: curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
      - name: The API refuses a call without the token
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/drafts)" = 401
      - name: The API answers with the token
        run: |
          curl -fsS -H "Authorization: Bearer demo-token-change-me" http://localhost:8080/api/drafts
      - name: The API answers the page's own headers (a visitor key, demo mode)
        run: |
          curl -fsS -H "X-Model-Preset: openrouter" -H "X-Model-Key: ci-dummy-key" http://localhost:8080/api/drafts
      # nginx's SPA fallback (web/nginx.conf) answers a missing /api/ route with a 200
      # index.html, so these check the body, not the status: the spec must parse as JSON
      # with paths, and the reference must be the Scalar page, not the SPA's root div.
      - name: The spec answers JSON through the web container, not the SPA page
        run: |
          curl -fsS http://localhost:8080/api/openapi.json |
            python3 -c 'import json,sys; spec=json.load(sys.stdin); assert spec["paths"], "spec has no paths"'
      - name: The reference answers the Scalar page through the web container, not the SPA page
        run: |
          body=$(curl -fsS http://localhost:8080/api/docs)
          echo "$body" | grep -q '/api/docs/scalar.js'
          ! echo "$body" | grep -q '<div id="root">'
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
        if: always()
