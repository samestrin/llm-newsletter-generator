name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=newsletter --cov-report=term-missing --cov-fail-under=80
      - run: uv run python -m newsletter.evals

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --wait --wait-timeout 300
      - name: The page is served
        run: curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
      - name: The page reaches the API through its own origin
        run: curl -fsS http://localhost:8080/api/health | grep -q '"ok"'
      - name: The API refuses a call without the token
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/drafts)" = 401
      - name: The API answers with the token
        run: |
          curl -fsS -H "Authorization: Bearer demo-token-change-me" http://localhost:8080/api/drafts
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - run: docker compose down --volumes
        if: always()
